appId: com.devorev.emailhandler
productName: Email Handler
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: build/icon.ico
    to: icon.ico
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Email Handler
